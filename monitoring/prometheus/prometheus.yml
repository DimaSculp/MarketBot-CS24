global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: bot
    static_configs:
      - targets: ["bot:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
