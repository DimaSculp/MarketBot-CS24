# Только для локальной разработки: compose подхватывает этот файл автоматически,
# а деплой копирует на сервер лишь compose.yaml, поэтому в проде порт БД не публикуется.
services:
  postgres:
    # Во внутренней сети публикация портов не работает, поэтому добавляем сеть default
    networks: [db, default]
    ports:
      # Доступ к БД для IDE и psql, только с этой машины
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

